name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure and links
        run: python3 skill/evidence-driven-development/scripts/validate_repository.py
      - name: Compile Python helpers
        run: python3 -m py_compile skill/evidence-driven-development/scripts/*.py skill/evidence-driven-development/tests/*.py
      - name: Run isolated workflow scenarios
        run: python3 -m unittest discover -s skill/evidence-driven-development/tests -v
